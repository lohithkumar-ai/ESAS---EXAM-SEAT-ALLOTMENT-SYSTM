services:
  - type: web
    name: esas-backend
    runtime: python
    rootDir: esas/backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-rho-jade-80.vercel.app,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://frontend-rho-jade-80.vercel.app
