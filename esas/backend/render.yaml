services:
  - type: web
    name: esas-exam-seat-allotment-systm
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python seed.py && python seed_semesters.py
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1,esas-exam-seat-allotment-systm.onrender.com,esas-exam-seat-allotment-systm-1.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://esas-exam-seat-allotment-systm.vercel.app,https://frontend-rho-jade-80.vercel.app,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://frontend-rho-jade-80.vercel.app,https://esas-exam-seat-allotment-systm.onrender.com,https://esas-exam-seat-allotment-systm-1.onrender.com,https://*.vercel.app
